<!-- JACOBI DEMO FIXTURE — deterministic synthetic page, not a real merchant -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marina Bay View Hotel, Dubai Marina — 3 nights | StayDemo</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1a1f2b; margin: 0; background: #f6f7f9; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; border: 1px solid #e5e8ee; border-radius: 12px; padding: 24px; }
    .hotel { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .loc { color: #5a6472; margin: 0 0 16px; }
    .dates { color: #333; margin: 0 0 20px; }
    .avail { display: inline-block; background: #fdecec; color: #b3261e; font-weight: 600;
             padding: 4px 10px; border-radius: 999px; font-size: 13px; margin-bottom: 20px; }
    .price-row { display: flex; align-items: baseline; justify-content: space-between;
                 border-top: 1px solid #eef0f4; padding-top: 16px; }
    .price-label { color: #5a6472; }
    .total { font-size: 30px; font-weight: 800; color: #0b1220; }
    .cta { display: block; text-align: center; margin-top: 20px; background: #5b7cf5;
           color: #fff; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 700; }
    .fine { color: #8a93a3; font-size: 12px; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="hotel">Marina Bay View Hotel, Dubai Marina</h1>
      <p class="loc">Dubai Marina, Dubai, United Arab Emirates</p>
      <p class="dates">Check-in Tue, Jul 15 · Check-out Fri, Jul 18 · 3 nights · 2 guests</p>

      <span class="avail" data-jacobi-field="availability" data-value="2 rooms left">2 rooms left</span>

      <div class="price-row">
        <span class="price-label">Total for 3 nights</span>
        <span class="total"
              data-jacobi-field="displayed_total"
              data-amount="2180"
              data-currency="AED">AED 2,180</span>
      </div>

      <a class="cta" href="#reserve">Reserve</a>
      <p class="fine">Taxes and fees calculated at checkout.</p>
    </div>
  </div>
</body>
</html>
