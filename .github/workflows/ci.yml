name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          cd backend
          # FAIL on exit 5 (no tests collected) — a broken/missing test suite
          # must never silently pass green. Also fail on collection errors
          # (exit 2), internal errors (exit 3), and usage errors (exit 4).
          set +e
          python -m pytest tests/ -q --tb=short 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo ""
            echo "CI FAILURE: pytest exited with code $code"
            echo "  exit 1 = test failures"
            echo "  exit 2 = collection error (bad test file / import)"
            echo "  exit 3 = internal error"
            echo "  exit 4 = usage error"
            echo "  exit 5 = NO TESTS COLLECTED (test suite is broken or empty)"
            exit "$code"
          fi
          echo "Backend tests passed."

  typecheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npx tsc --noEmit

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend unit tests
        run: cd frontend && npm run test:unit

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test-backend, typecheck-frontend, test-frontend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build . -t jacobi:latest
